<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kato Agent — Mission Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="status-bar">
    <div class="status-left">
      <span id="ws-indicator" class="ws-disconnected" title="WebSocket disconnected">●</span>
      <span class="app-title">KATO AGENT</span>
    </div>
    <div class="status-right">
      <span id="event-count">0 events</span>
      <button id="theme-toggle" title="Toggle theme">◐</button>
    </div>
  </header>

  <main id="workspace">
    <!-- ═══ F2: MISSION MODE (default) ═══ -->
    <section id="mission-view">
      <!-- Mission Card: Goal + Status -->
      <div class="card mission-card">
        <div class="card-label">CURRENT MISSION</div>
        <div id="mission-goal" class="mission-goal">Awaiting task</div>
        <div class="mission-status">
          <span id="mission-status-badge" class="badge badge-idle">IDLE</span>
        </div>
      </div>

      <!-- Split: Active Tools | Current Decision -->
      <div class="split-panel">
        <div class="card split-left">
          <div class="card-label">ACTIVE TOOLS</div>
          <div id="active-tools" class="active-tools-list">
            <div class="empty-state">No active tools</div>
          </div>
        </div>
        <div class="card split-right">
          <div class="card-label">CURRENT DECISION</div>
          <div id="current-decision" class="current-decision">
            <div class="empty-state">No decision yet</div>
          </div>
        </div>
      </div>

      <!-- Next Action -->
      <div class="card">
        <div class="card-label">NEXT ACTION</div>
        <div id="next-action" class="next-action">—</div>
      </div>

      <!-- Timeline -->
      <div class="card timeline-card">
        <div class="card-header">
          <span class="card-label">TIMELINE</span>
          <div class="timeline-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="task">Task</button>
            <button class="filter-btn" data-filter="tool">Tool</button>
            <button class="filter-btn" data-filter="decision">Decision</button>
            <button class="filter-btn" data-filter="file">File</button>
          </div>
        </div>
        <div id="timeline" class="timeline-list">
          <div class="empty-state">No events yet</div>
        </div>
      </div>

      <!-- File Changes -->
      <div class="card">
        <div class="card-label">FILE CHANGES</div>
        <div id="file-changes" class="file-list">
          <div class="empty-state">No file changes</div>
        </div>
      </div>

      <!-- Error Display (hidden when no error) -->
      <div id="error-display" class="card error-card hidden">
        <div class="card-label">ERROR</div>
        <div id="error-message" class="error-message"></div>
      </div>
    </section>

    <!-- ═══ INSPECTOR PANEL (right slide) ═══ -->
    <aside id="inspector" class="inspector-panel hidden">
      <div class="inspector-header">
        <span id="inspector-title" class="inspector-title">Inspector</span>
        <button id="inspector-close" class="inspector-close" title="Close (Esc)">✕</button>
      </div>
      <div id="inspector-content" class="inspector-content">
        <!-- Rendered dynamically by renderInspector() -->
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
