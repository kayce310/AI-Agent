<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ISEKAI RPG - Pixel Art Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        canvas {
            background: #0f3460;
            border: 3px solid #e94560;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hud {
            background: #16213e;
            padding: 15px;
            border: 2px solid #e94560;
            border-radius: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #a8dadc;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: #0f3460;
            border: 1px solid #e94560;
            margin-top: 5px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff006e);
            width: 100%;
            transition: width 0.3s ease;
        }

        .sidebar {
            width: 250px;
            background: #16213e;
            padding: 15px;
            border: 2px solid #e94560;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-section {
            background: #0f3460;
            padding: 10px;
            border-radius: 3px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: bold;
            color: #a8dadc;
            margin-bottom: 8px;
            border-bottom: 1px solid #e94560;
            padding-bottom: 5px;
        }

        .inventory-item, .log-line {
            font-size: 12px;
            color: #fff;
            padding: 5px;
            margin: 2px 0;
            background: rgba(233, 69, 96, 0.2);
            border-left: 2px solid #e94560;
            padding-left: 8px;
        }

        .log-line {
            font-size: 11px;
            color: #a8dadc;
        }

        .controls {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #e94560;
        }

        .control-text {
            font-size: 12px;
            color: #a8dadc;
            margin: 3px 0;
        }

        .status-good { color: #06d6a0; }
        .status-warning { color: #ffd60a; }
        .status-danger { color: #e94560; }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .hud {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div class="hud">
                <div class="stat">
                    <div class="stat-label">HP</div>
                    <div class="health-bar">
                        <div class="health-fill" id="healthBar"></div>
                    </div>
                    <div class="stat-value"><span id="hp">100</span>/100</div>
                </div>
                <div class="stat">
                    <div class="stat-label">LEVEL</div>
                    <div class="stat-value" id="level">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">EXP</div>
                    <div class="stat-value"><span id="exp">0</span>/100</div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">📊 STATS</div>
                <div class="control-text"><span class="status-good">ATK:</span> <span id="atk">10</span></div>
                <div class="control-text"><span class="status-good">DEF:</span> <span id="def">5</span></div>
                <div class="control-text"><span class="status-good">SPD:</span> <span id="spd">3</span></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">🎒 INVENTORY</div>
                <div id="inventory"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">📜 LOG</div>
                <div id="gameLog" style="max-height: 150px; overflow-y: auto;"></div>
            </div>

            <div class="sidebar-section controls">
                <div class="sidebar-title">⌨️ CONTROLS</div>
                <div class="control-text">↑↓←→ Move</div>
                <div class="control-text">SPACE Attack</div>
                <div class="control-text">E Interact</div>
                <div class="control-text">R Recover</div>
            </div>
        </div>
    </div>

    <script>
        // ============ GAME ENGINE ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const TILE_SIZE = 32;
        const GRID_WIDTH = canvas.width / TILE_SIZE;
        const GRID_HEIGHT = canvas.height / TILE_SIZE;

        // Game state
        let gameState = {
            player: null,
            enemies: [],
            items: [],
            level: 1,
            exp: 0,
            expNeeded: 100,
            inventory: [],
            log: [],
            gameTime: 0,
            isPaused: false
        };

        // ============ SPRITE DEFINITIONS (Pixel Art via Canvas) ============
        
        class Sprite {
            constructor(x, y, width, height, color, type = 'player') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.type = type;
                this.hp = 100;
                this.maxHp = 100;
            }

            draw(ctx) {
                // Draw character body
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Draw simple pixel art face
                if (this.type === 'player') {
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(this.x + 6, this.y + 6, 4, 4);
                    ctx.fillRect(this.x + 18, this.y + 6, 4, 4);
                    // Mouth
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + 16, this.y + 18, 4, 0, Math.PI);
                    ctx.stroke();
                } else if (this.type === 'enemy') {
                    // Enemy eyes (red)
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x + 4, this.y + 4, 6, 6);
                    ctx.fillRect(this.x + 18, this.y + 4, 6, 6);
                }

                // Draw HP bar above sprite
                this.drawHpBar(ctx);
            }

            drawHpBar(ctx) {
                const barWidth = this.width;
                const barHeight = 4;
                const barX = this.x;
                const barY = this.y - 8;

                // Background
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                // Health
                const hpPercent = this.hp / this.maxHp;
                ctx.fillStyle = hpPercent > 0.5 ? '#00ff00' : hpPercent > 0.25 ? '#ffff00' : '#ff0000';
                ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

                // Border
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp < 0) this.hp = 0;
                return this.hp <= 0;
            }

            heal(amount) {
                this.hp = Math.min(this.hp + amount, this.maxHp);
            }
        }

        // ============ PLAYER ============
        class Player extends Sprite {
            constructor(x, y) {
                super(x, y, 32, 32, '#4a90e2', 'player');
                this.vx = 0;
                this.vy = 0;
                this.speed = 2;
                this.attack = 10;
                this.defense = 5;
                this.inventory = [];
                this.cooldown = 0;
                this.maxHp = 100;
                this.hp = 100;
            }

            update() {
                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Boundary checking
                this.x = Math.max(0, Math.min(this.x, canvas.width - this.width));
                this.y = Math.max(0, Math.min(this.y, canvas.height - this.height));

                // Cooldown
                if (this.cooldown > 0) this.cooldown--;

                // Collision with enemies
                gameState.enemies.forEach(enemy => {
                    if (this.isColliding(enemy)) {
                        this.takeDamage(1);
                        addLog(`Bị quái tấn công! HP: ${this.hp}`);
                    }
                });

                // Collision with items
                gameState.items = gameState.items.filter(item => {
                    if (this.isColliding(item)) {
                        this.collectItem(item);
                        return false;
                    }
                    return true;
                });
            }

            isColliding(other) {
                return this.x < other.x + other.width &&
                       this.x + this.width > other.x &&
                       this.y < other.y + other.height &&
                       this.y + this.height > other.y;
            }

            attack_action(targets) {
                if (this.cooldown > 0) return;

                targets.forEach(target => {
                    const damage = Math.max(1, this.attack - Math.floor(Math.random() * 3));
                    if (target.takeDamage(damage)) {
                        gameState.exp += 50;
                        gameState.inventory.push({ type: 'exp-orb', value: 50 });
                        addLog(`🎉 Giết quái! EXP: +50`);
                        gameState.enemies = gameState.enemies.filter(e => e.hp > 0);
                    } else {
                        addLog(`⚔️ Tấn công ${damage} sát thương`);
                    }
                });

                this.cooldown = 20;
            }

            collectItem(item) {
                this.inventory.push(item);
                addLog(`📦 Nhặt: ${item.name}`);
            }
        }

        // ============ ENEMY ============
        class Enemy extends Sprite {
            constructor(x, y) {
                super(x, y, 28, 28, '#e74c3c', 'enemy');
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.speed = 1;
                this.attack = 5;
                this.maxHp = 40;
                this.hp = 40;
                this.ai_timer = 0;
            }

            update() {
                // Simple AI: patrol + chase player
                this.ai_timer++;

                // Chase player if close
                const dx = gameState.player.x - this.x;
                const dy = gameState.player.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 150) {
                    this.vx = (dx / distance) * this.speed;
                    this.vy = (dy / distance) * this.speed;
                } else {
                    // Random patrol
                    if (this.ai_timer % 60 === 0) {
                        this.vx = (Math.random() - 0.5) * 1;
                        this.vy = (Math.random() - 0.5) * 1;
                    }
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Boundary
                this.x = Math.max(0, Math.min(this.x, canvas.width - this.width));
                this.y = Math.max(0, Math.min(this.y, canvas.height - this.height));
            }
        }

        // ============ ITEM ============
        class Item {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 16;
                this.height = 16;
                this.type = type;
                this.name = type === 'potion' ? '💊 Potion' : '💰 Gold';
                this.value = type === 'potion' ? 30 : 10;
            }

            draw(ctx) {
                ctx.fillStyle = this.type === 'potion' ? '#ff69b4' : '#ffd700';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        // ============ GAME LOGIC ============
        
        function spawnEnemies() {
            for (let i = 0; i < 3 + gameState.level; i++) {
                let x, y, tooClose = true;
                while (tooClose) {
                    x = Math.random() * (canvas.width - 50) + 25;
                    y = Math.random() * (canvas.height - 50) + 25;
                    const dx = x - gameState.player.x;
                    const dy = y - gameState.player.y;
                    tooClose = Math.sqrt(dx*dx + dy*dy) < 200;
                }
                gameState.enemies.push(new Enemy(x, y));
            }
        }

        function spawnItems() {
            if (Math.random() < 0.02) {
                const type = Math.random() < 0.3 ? 'potion' : 'gold';
                gameState.items.push(new Item(
                    Math.random() * (canvas.width - 16),
                    Math.random() * (canvas.height - 16),
                    type
                ));
            }
        }

        function addLog(text) {
            gameState.log.unshift(text);
            if (gameState.log.length > 10) gameState.log.pop();
            updateUI();
        }

        function update() {
            gameState.player.update();
            gameState.enemies.forEach(enemy => enemy.update());
            spawnItems();

            // Check level up
            if (gameState.exp >= gameState.expNeeded) {
                gameState.exp -= gameState.expNeeded;
                gameState.level++;
                gameState.expNeeded = Math.floor(gameState.expNeeded * 1.2);
                gameState.player.attack += 2;
                gameState.player.defense += 1;
                gameState.player.maxHp += 10;
                gameState.player.heal(10);
                addLog(`⭐ LEVEL UP! Lv.${gameState.level}`);
                spawnEnemies();
            }

            // Spawn enemies if needed
            if (gameState.enemies.length < 3 + gameState.level) {
                spawnEnemies();
            }

            gameState.gameTime++;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_WIDTH; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= GRID_HEIGHT; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_SIZE);
                ctx.lineTo(canvas.width, i * TILE_SIZE);
                ctx.stroke();
            }

            // Draw items
            gameState.items.forEach(item => item.draw(ctx));

            // Draw enemies
            gameState.enemies.forEach(enemy => enemy.draw(ctx));

            // Draw player
            gameState.player.draw(ctx);

            // Draw UI text
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText(`Lv.${gameState.level} | EXP: ${gameState.exp}/${gameState.expNeeded} | Enemies: ${gameState.enemies.length}`, 10, 25);
        }

        function gameLoop() {
            update();
            draw();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // ============ INPUT HANDLING ============
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                const closeEnemies = gameState.enemies.filter(enemy => {
                    const dx = enemy.x - gameState.player.x;
                    const dy = enemy.y - gameState.player.y;
                    return Math.sqrt(dx*dx + dy*dy) < 80;
                });
                gameState.player.attack_action(closeEnemies);
            }

            if (e.key.toLowerCase() === 'r') {
                const potions = gameState.inventory.filter(i => i.type === 'potion');
                if (potions.length > 0) {
                    gameState.player.heal(30);
                    gameState.inventory = gameState.inventory.filter(i => i.type !== 'potion');
                    addLog('💊 Sử dụng Potion! HP +30');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function handleInput() {
            gameState.player.vx = 0;
            gameState.player.vy = 0;

            if (keys['arrowup'] || keys['w']) gameState.player.vy = -gameState.player.speed;
            if (keys['arrowdown'] || keys['s']) gameState.player.vy = gameState.player.speed;
            if (keys['arrowleft'] || keys['a']) gameState.player.vx = -gameState.player.speed;
            if (keys['arrowright'] || keys['d']) gameState.player.vx = gameState.player.speed;
        }

        // ============ UI UPDATE ============
        function updateUI() {
            handleInput();

            // Health bar
            document.getElementById('healthBar').style.width = (gameState.player.hp / gameState.player.maxHp * 100) + '%';
            document.getElementById('hp').textContent = gameState.player.hp;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('exp').textContent = gameState.exp;
            document.getElementById('atk').textContent = gameState.player.attack;
            document.getElementById('def').textContent = gameState.player.defense;
            document.getElementById('spd').textContent = gameState.player.speed;

            // Inventory
            const invHtml = gameState.inventory.map(item => `<div class="inventory-item">${item.name || item.type}</div>`).join('');
            document.getElementById('inventory').innerHTML = invHtml || '<div class="inventory-item">Empty</div>';

            // Log
            const logHtml = gameState.log.map(line => `<div class="log-line">${line}</div>`).join('');
            document.getElementById('gameLog').innerHTML = logHtml;

            // Game over
            if (gameState.player.hp <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText(`Final Level: ${gameState.level}`, canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // ============ INIT ============
        function init() {
            gameState.player = new Player(canvas.width / 2, canvas.height / 2);
            spawnEnemies();
            addLog('🎮 Game Started!');
            addLog('Sử dụng mũi tên để di chuyển');
            addLog('Nhấn SPACE để tấn công');
            gameLoop();
        }

        // Start game
        init();
    </script>
</body>
</html>
