# ── Coral Agent — Docker Compose ──
# Usage: docker compose up -d

services:
  coral:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coral-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CORAL_WARMUP=true
    volumes:
      # Persist memory and knowledge across container restarts
      - coral-memory:/app/knowledge/memory
      - coral-memory-store:/app/knowledge/memory-store
      - coral-raw-input:/app/knowledge/raw-input
      - coral-raw-md:/app/knowledge/raw-md
      # Mount blueprints for document processing
      - ./knowledge/blueprints:/app/knowledge/blueprints:ro
      # Mount wiki for knowledge graph
      - ./knowledge/wiki:/app/knowledge/wiki
    ports:
      # HTTP Health Check endpoint (Docker healthcheck)
      - "8766:8766"
      # WebSocket Event Server (optional)
      - "8765:8765"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8766/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    resources:
      limits:
        cpus: '1'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  coral-memory:
  coral-memory-store:
  coral-raw-input:
  coral-raw-md:
