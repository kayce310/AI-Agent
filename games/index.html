<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEKAI RPG - Complete Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        #loadingScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            border: 2px solid #fff;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.1);
        }
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
        }
        .menu-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        .menu-button {
            display: block;
            width: 200px;
            padding: 15px;
            margin: 10px auto;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 2px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .menu-button:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: scale(1.05);
        }
        #infoPanel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #fff;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h2>ISEKAI RPG - Đang tải...</h2>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <p id="loadingText">Khởi tạo game engine...</p>
    </div>

    <canvas id="gameCanvas" width="1024" height="768"></canvas>

    <div id="infoPanel">
        <div>Level: <span id="infoLevel">1</span></div>
        <div>HP: <span id="infoHP">100</span> / <span id="infoMaxHP">100</span></div>
        <div>MP: <span id="infoMP">50</span> / <span id="infoMaxMP">50</span></div>
        <div>EXP: <span id="infoEXP">0</span> / <span id="infoMaxEXP">100</span></div>
        <div>Gold: <span id="infoGold">0</span></div>
    </div>

    <div id="menuScreen" class="menu-screen">
        <h2>GAME PAUSED</h2>
        <button class="menu-button" onclick="game.resume()">Tiếp tục</button>
        <button class="menu-button" onclick="game.showSettings()">Cài đặt</button>
        <button class="menu-button" onclick="game.saveGame()">Lưu game</button>
        <button class="menu-button" onclick="game.quitGame()">Thoát</button>
    </div>

    <script src="src/engine.js"></script>
    <script src="src/core/Entity.js"></script>
    <script src="src/core/Component.js"></script>
    <script src="src/systems/UpdateSystem.js"></script>
    <script src="src/systems/RenderSystem.js"></script>
    <script src="src/systems/InputSystem.js"></script>
    <script src="src/systems/CollisionSystem.js"></script>
    <script src="src/components/Transform.js"></script>
    <script src="src/components/Sprite.js"></script>
    <script src="src/components/Physics.js"></script>
    <script src="src/components/Stats.js"></script>
    <script src="src/components/Inventory.js"></script>
    <script src="src/components/AI.js"></script>
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/NPC.js"></script>
    <script src="src/entities/Enemy.js"></script>
    <script src="src/entities/Item.js"></script>
    <script src="src/game/Game.js"></script>
    <script src="src/game/Scene.js"></script>
    <script src="src/states/GameMenuState.js"></script>
    <script src="src/states/GameplayState.js"></script>
    <script src="src/states/PauseState.js"></script>
    <script src="src/input/KeyboardInput.js"></script>
    <script src="src/utils/MathUtils.js"></script>
    <script src="src/utils/AssetLoader.js"></script>
    <script src="main.js"></script>
</body>
</html>
