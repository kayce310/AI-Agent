name: Structure Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-structure:
    name: 🔍 Governance Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run structure validation
        run: npx tsx scripts/validate-structure.ts --strict

      - name: Report results
        if: failure()
        run: |
          echo "::error::Structure validation failed. Check logs above for violations."
          exit 1
