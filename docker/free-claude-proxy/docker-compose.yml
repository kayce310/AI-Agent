version: '3.8'

services:
  free-claude-proxy:
    build: .
    container_name: free-claude-proxy
    ports:
      - "8082:8082"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=8082
    restart: unless-stopped
    networks:
      - kato-network

networks:
  kato-network:
    driver: bridge