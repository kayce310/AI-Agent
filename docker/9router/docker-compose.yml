version: '3.8'

services:
  9router:
    build:
      context: E:\Test\9router
      dockerfile: Dockerfile
    container_name: 9router
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    volumes:
      - 9router-data:/app/data
    restart: unless-stopped
    networks:
      - kato-network

networks:
  kato-network:
    driver: bridge

volumes:
  9router-data: